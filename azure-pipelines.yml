name: PolicyApi

trigger:
- main

# resources:
#   repositories:
#     - repository: templates
#       type: github
#       name: itsbibeksaini/pipeline-templates
#       endpoint: github.com_itsbibeksaini

pr: none

pool:
  vmImage: ubuntu-latest

# variables:  
#   imageRepository: 'policyapi'
#   helmChart: './policyapi-chart'  
#   valueFile: './policyapi-chart/values.yaml'
#   tag: $(Build.SourceBranchName)_$(Build.SourceVersion)
#   vmImageName: ubuntu-latest

stages:
- stage: BuildImage
  displayName: Build and push .NET Application.
  jobs:  
  - job: Build
    displayName: Building .NET Application.
    steps:         
      - task: UseDotNet@2
        displayName: Install .NET SDK.
        inputs:
          version: '6.0.x'
      - task: DotNetCoreCLI@2
        displayName: Restore nuget packages.
        inputs:
          command: 'restore'
          feedsToUse: 'select'
          projects: "**/*.csproj"
          includeNuGetOrg: true
      - task: DotNetCoreCLI@2
        displayName: Build .NET Application.
        inputs:
          command: 'build'
          projects: ./PolicyApi.sln
      - task: DotNetCoreCLI@2
        displayName: Test .NET Application.
        inputs:
          command: test
          projects: '**/*Test/*.csproj'
      - task: DotNetCoreCLI@2
        displayName: Publish .NET Application.
        inputs:
          command: publish
          arguments: -c release
      - script: |
          ls          
          cd PolicyApi/bin/release/net6.0/publish/
          echo '###########'
          ls
      - task: PublishPipelineArtifact@0
        displayName: Store artefact
        inputs:
          artifactName: 'PolicyApi'
          targetPath: 'PolicyApi/bin/release/net6.0/publish/'
