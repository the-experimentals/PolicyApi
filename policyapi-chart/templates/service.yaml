apiVersion: v1
kind: Service
metadata:
  name: {{ include "policyapi-chart.fullname" . }}
  labels:
    {{- include "policyapi-chart.labels" . | nindent 4 }}
  annotations:
    'consul.hashicorp.com/service-sync': 'true'
spec:
  type: {{ .Values.service.type }}
  ports:
{{- range $key, $value := .Values.service.Ports }}
  - name: {{ $key }}
{{ toYaml $value | indent 4 }}
{{- end }}
  selector:
    {{- include "policyapi-chart.selectorLabels" . | nindent 4 }}
    app: {{ include "accountapi-chart.fullname" . }}
